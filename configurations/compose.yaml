services:
  caddy:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: caddy:2
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../.certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${APPS_ROOT}:/var/www/html:ro
    depends_on:
      - app

  synchronizer:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: alpine:3
    depends_on:
      - app
      - caddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pid: "service:app"
    environment:
      APPS_ROOT: /var/www/html
      SYNCHRONIZER_INTERVAL_SECONDS: ${SYNCHRONIZER_INTERVAL_SECONDS:-2}
      SYNCHRONIZER_HOT_STALE_SECONDS: ${SYNCHRONIZER_HOT_STALE_SECONDS:-6}
      SYNCHRONIZER_PRUNE_STALE_HOT_FILES: ${SYNCHRONIZER_PRUNE_STALE_HOT_FILES:-true}
      SYNCHRONIZER_TIMEOUT_SECONDS: ${SYNCHRONIZER_TIMEOUT_SECONDS:-1}
      SYNCHRONIZER_VERBOSE: ${SYNCHRONIZER_VERBOSE:-false}
      SYNCHRONIZER_APP_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8443}
      SYNCHRONIZER_AUTOLOAD_SETTLE_SECONDS: ${SYNCHRONIZER_AUTOLOAD_SETTLE_SECONDS:-4}
      SYNCHRONIZER_AUTOLOAD_COOLDOWN_SECONDS: ${SYNCHRONIZER_AUTOLOAD_COOLDOWN_SECONDS:-20}
      SYNCHRONIZER_RESUME_RELOAD_THRESHOLD_SECONDS: ${SYNCHRONIZER_RESUME_RELOAD_THRESHOLD_SECONDS:-30}
    command: ["/bin/sh", "/usr/local/bin/synchronizer.sh"]
    volumes:
      - ${APPS_ROOT}:/var/www/html
      - ./synchronizer.sh:/usr/local/bin/synchronizer.sh:ro

  app:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-security.debian.org}
    working_dir: /var/www/html
    volumes:
      - ${HOST_HOME_PATH}:${HOST_HOME_PATH}:ro
      - ${APPS_ROOT}:/var/www/html
    expose:
      - "9000"
      - "5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AWS_ENDPOINT: http://minio:9000

  mysql:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"

  redis:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data

  mailpit:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
      - "${MAILPIT_UI_PORT:-8026}:8025"

  minio:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"

  minio-client:
    restart: "${STACKER_RESTART_POLICY:-unless-stopped}"
    image: minio/mc
    entrypoint: ["sh", "-c", "sleep infinity"]

networks:
  default:
    name: lara-stacker_default
    external: true

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  minio_data:
  redis_data:
