services:
  caddy:
    image: caddy:2
    environment:
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-8443}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile.${HTTPS_TRUST_MODE:-caddy}:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${APP_ROOT}:/var/www/html:ro
    depends_on:
      - app

  app:
    build:
      context: ./files
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        NODE_VERSION: ${NODE_VERSION:-20}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-security.debian.org}
        APT_PROXY: ${APT_PROXY:-}
        INSTALL_MEDIA_TOOLS: ${INSTALL_MEDIA_TOOLS:-true}
    working_dir: /var/www/html
    volumes:
      - ${APP_ROOT}:/var/www/html
    expose:
      - "9000"
      - "5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    ports:
      - "6380:6379"

  postgres:
    image: postgres:16
    profiles:
      - postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  mailpit:
    image: axllent/mailpit:latest
    profiles:
      - mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"

  minio-client:
    image: minio/mc
    profiles:
      - minio
    entrypoint: ["sh", "-c", "sleep infinity"]

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  minio_data:
  postgres_data:
